name: bda
channels:
  - conda-forge
dependencies:
  - python=3.10
  - gdal<3.9
  - numpy
  - setuptools
  - pip
  # tippecanoe: builds the building-embedding PMTiles in embed_buildings.py
  - tippecanoe
  - pip:
    - torch==2.5.1+cu124
    - torchvision==0.20.1+cu124
    - lightning==2.6.1
    # Deliberately NOT torchgeo[all]. The code only uses core symbols
    # (datasets.NonGeoDataset, models.RCF, trainers.SemanticSegmentationTask),
    # which plain torchgeo provides. The `all` extra pulled vtk + pyvista
    # (639 MB), laspy, h5py, scikit-image and bitsandbytes (122 MB), none of
    # which are imported anywhere or required by another installed package.
    - torchgeo==0.6.2
    - torchmetrics==1.9.0
    - segmentation_models_pytorch==0.5.0
    - --extra-index-url https://download.pytorch.org/whl/cu124
    - adlfs==2024.12.0
    - azure-storage-blob==12.25.1
    - dask_geopandas==0.4.3
    - deltalake==1.6.1
    - geopandas==1.0.1
    - mercantile==1.2.1
    - osmnx==2.0.2
    - planetary_computer==1.0.0
    - pyarrow==23.0.1
    # cv2 is used by hastegeo/core/utils/imagery.py and
    # docker/training/code/create_masks.py, but only ever arrived unpinned via
    # torchgeo[all] -- it had drifted to opencv-python 5.0.0.93. Pinned here to
    # the version the rest of the repo uses; headless since containers have no GUI.
    - opencv-python-headless==4.10.0.84
    - rasterio==1.4.3
    - s3fs==2025.3.2
    - scikit-learn==1.6.1
    - tensorboard==2.19.0
    # DamageTriageFormer (Option B): DINOv3 ViT-L/16 backbone + instance heads.
    # Upper bound is load-bearing: transformers 5.x restructures the ViT module
    # tree, so DinoV3Backbone's `vit.encoder.layer` / `vit.layer` lookup finds
    # neither and raises "Could not find transformer layers in model" at model
    # construction (src/model/backbone.py). 4.56+ is required for dinov3_vit to
    # be a recognized model_type at all.
    - transformers>=4.56,<5
    - timm
    - einops
    - huggingface_hub>=0.34.0