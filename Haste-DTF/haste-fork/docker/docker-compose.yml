# Docker Compose for HASTE local development
#
# IMPORTANT: This configuration is intended for local development and evaluation
# only. It uses development defaults (Azurite storage emulator, DEVELOPMENT_MODE,
# wildcard CORS, well-known Azurite credentials) that are NOT suitable for
# production use. For production deployment see docs/deployment.md.
#
# Usage:
#   Local development:  docker-compose up
#   Build only:         docker-compose build
#
# Environment:
#   - RUNNER_TYPE: "local" (default for this compose) or "azure_batch" (for remote)
#   - DEVELOPMENT_MODE: "true" for local, "false" for production

services:
  # ==============================================================================
  # INFRASTRUCTURE SERVICES
  # ==============================================================================

  # The connection strings throughout this file use the Azurite well-known
  # development key. This is a public default documented at:
  # https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azurite
  # It is NOT a secret and will NOT grant access to any real Azure resources.
  azurite:
    build:
      context: ..
      dockerfile: ./docker/emulators/Dockerfile
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data  # Shared volume for blob storage

  # Initialize Azurite with data files
  data-init:
    build:
      context: ..
      dockerfile: ./docker/data-init/Dockerfile
    volumes:
      - azurite-data:/shared/azurite
      # The bind-mounted host `data` directory is shared with the
      # hastefuncapi / hastefuncqueues containers as /app/data. Those
      # containers run as the non-root `appuser` (UID 999) and need to
      # be able to create per-project chunk-staging subdirectories
      # there. The directory is owned by root on the host, so we widen
      # its perms here (data-init runs as root) before the main
      # services start; otherwise chunked uploads fail with
      # `PermissionError: '/app/data/<project>'`.
      - ../data:/shared/app-data
      # Pre-downloaded DTF checkpoint + DINOv3 backbone from the host
      # (see download_models.py at the repo root). Copied into the
      # azurite named volume below so that spawned sibling task
      # containers (LocalRunner, runners/local.py) can see them too —
      # those are launched via the Docker socket as siblings, not
      # descendants, so they can't reach this host bind mount directly,
      # but they do already share the azurite volume.
      - ../../../models:/shared/models-src:ro
    command: >
      sh -c 'chmod -R 777 /shared/azurite /shared/app-data &&
             if [ ! -f /shared/azurite/models/damage_triage/best_model.pth ]; then
               mkdir -p /shared/azurite/models &&
               cp -r /shared/models-src/damage_triage /shared/azurite/models/ &&
               cp -r /shared/models-src/backbone /shared/azurite/models/ &&
               chmod -R 777 /shared/azurite/models;
             fi &&
             python /upload_data.py'
    depends_on:
      - azurite
    restart: "no"  # Run once and exit

  # NGINX proxy for CORS handling
  api-proxy:
    image: mcr.microsoft.com/oss/nginx/nginx:1.21.6
    ports:
      - "7071:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - hastefuncapi

  titiler:
    build:
      context: ..
      dockerfile: ./docker/titiler/Dockerfile
    image: haste-titiler
    ports:
      - "8000:8000"
    depends_on:
      - azurite

  # PostGIS-backed hg_buildings table for the AOI-scoped DamageTriageFormer
  # path (modelType="dtf-aoi" — docs/OptionB_AOI_Integration_Plan.md).
  # hastegeo.core.utils.postgis_connect reads POSTGRES_HOST/PORT/DATABASE/
  # USER/PASSWORD (below, wired into hastefuncapi/hastefuncqueues) to
  # connect here with plain password auth for local dev; production uses
  # a real Azure Database for PostgreSQL with DefaultAzureCredential
  # instead (no POSTGRES_PASSWORD set).
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: haste
      POSTGRES_PASSWORD: haste-dev-only  # pragma: allowlist secret # gitleaks:allow
      POSTGRES_DB: haste
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      # Runs every .sql file here, in filename order, on first container
      # start: 0000_enable_postgis.sql then 0001_hg_buildings.sql.
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haste -d haste"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==============================================================================
  # API SERVICES
  # ==============================================================================

  hastefuncapi:
    build:
      context: ..
      dockerfile: ./api/hastefuncapi/Dockerfile
    environment:
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;"  # pragma: allowlist secret # gitleaks:allow
      ASPNETCORE_URLS: "http://+:8080"
      DATA_PATH: "/app/data"
      DEVELOPMENT_MODE: "true"
      FUNCTIONS_WORKER_RUNTIME: "python"
      AzureWebJobsFeatureFlags: "EnableWorkerIndexing"
      AzureWebJobsDisableHomepage: "true"
      AZURE_FUNCTIONS_ENVIRONMENT: "Development"
      languageWorkers__python__requests__postUri: "http://127.0.0.1:8080/admin/host/ping"
      AzureFunctionsJobHost__logging__logLevel__default: "Debug"
      AzureFunctionsJobHost__logging__logLevel__Host: "Information"
      AzureFunctionsJobHost__logging__logLevel__Function: "Information"
      AzureFunctionsJobHost__logging__logLevel__Worker: "Debug"
      BLOB_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;"  # pragma: allowlist secret # gitleaks:allow
      QUEUE_ACCOUNT_URL: "http://azurite:10001/devstoreaccount1"
      BLOB_ACCOUNT_URL: "http://azurite:10000/devstoreaccount1"
      IMAGE_QUEUE_NAME: "local-image-queue"
      TRAIN_QUEUE_NAME: "local-train-queue"
      STATS_QUEUE_NAME: "local-stats-queue"
      ZIP_QUEUE_NAME: "local-zip-queue"
      INFERENCE_QUEUE_NAME: "local-inference-queue"
      EMBEDDING_QUEUE_NAME: "local-embedding-queue"
      DTF_QUEUE_NAME: "local-dtf-queue"
      DTF_AOI_QUEUE_NAME: "local-dtf-aoi-queue"
      BLOB_CONTAINER: "data"
      METADATA_STORAGE_TYPE: "blob"
      IMAGERY_STORAGE_TYPE: "blob"
      ARTIFACT_STORAGE_TYPE: "blob"
      TITILER_ENDPOINT: "http://titiler:8000/"
      TITILER_PUBLIC_ENDPOINT: "http://${HOST_IP:-localhost}:7071/api/titiler/"
      POSTGRES_HOST: "postgis"
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: "haste"
      POSTGRES_USER: "haste"
      POSTGRES_PASSWORD: "haste-dev-only"  # pragma: allowlist secret # gitleaks:allow
      # The local postgis image has no TLS; hastegeo defaults to
      # sslmode=require for production safety, so dev opts out here.
      POSTGRES_SSLMODE: "disable"
      # Pre-downloaded DamageTriageFormer checkpoint paths (skip HuggingFace download)
      DTF_CHECKPOINT_PATH: "/app/models/damage_triage/best_model.pth"
      DTF_CHECKPOINT_CONFIG_PATH: "/app/models/damage_triage/config.json"
    volumes:
      - ../data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../../models/damage_triage:/app/models/damage_triage:ro  # Pre-downloaded DTF checkpoint
    group_add:
      - "${DOCKER_GID:-1001}"
    depends_on:
      azurite:
        condition: service_started
      data-init:
        condition: service_completed_successfully
      titiler:
        condition: service_started
      postgis:
        condition: service_healthy

  hastefuncqueues:
    build:
      context: ..
      dockerfile: ./api/hastefuncqueues/Dockerfile
    environment:
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;"  # pragma: allowlist secret # gitleaks:allow
      ASPNETCORE_URLS: "http://+:8080"
      DATA_PATH: "/app/data"
      DEVELOPMENT_MODE: "true"
      FUNCTIONS_WORKER_RUNTIME: "python"
      AzureWebJobsFeatureFlags: "EnableWorkerIndexing"
      AzureWebJobsDisableHomepage: "true"
      AZURE_FUNCTIONS_ENVIRONMENT: "Development"
      languageWorkers__python__requests__postUri: "http://127.0.0.1:8080/admin/host/ping"
      AzureFunctionsJobHost__logging__logLevel__default: "Information"
      AzureFunctionsJobHost__logging__logLevel__Host: "Information"
      AzureFunctionsJobHost__logging__logLevel__Function: "Information"
      AzureFunctionsJobHost__logging__logLevel__Worker: "Information"
      AzureFunctionsJobHost__logging__logLevel__haste: "Information"
      # Hugging Face fallback only. local.py now points spawned task
      # containers at the pre-downloaded models under /shared/azurite/models
      # (copied there by data-init from the host's models/ dir) via
      # DTF_CHECKPOINT_PATH / DTF_CHECKPOINT_CONFIG_PATH / DTF_BACKBONE_DIR,
      # so this is only used if that local copy is ever missing. Set
      # HF_TOKEN in your shell before `docker compose up` if you need the
      # fallback against facebook/dinov3-vitl16-pretrain-lvd1689m.
      HF_TOKEN: "${HF_TOKEN:-}"
      BLOB_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;"  # pragma: allowlist secret # gitleaks:allow
      QUEUE_ACCOUNT_URL: "http://azurite:10001/devstoreaccount1"
      BLOB_ACCOUNT_URL: "http://azurite:10000/devstoreaccount1"
      IMAGE_QUEUE_NAME: "local-image-queue"
      TRAIN_QUEUE_NAME: "local-train-queue"
      STATS_QUEUE_NAME: "local-stats-queue"
      ZIP_QUEUE_NAME: "local-zip-queue"
      INFERENCE_QUEUE_NAME: "local-inference-queue"
      EMBEDDING_QUEUE_NAME: "local-embedding-queue"
      DTF_QUEUE_NAME: "local-dtf-queue"
      DTF_AOI_QUEUE_NAME: "local-dtf-aoi-queue"
      BLOB_CONTAINER: "data"
      METADATA_STORAGE_TYPE: "blob"
      IMAGERY_STORAGE_TYPE: "blob"
      ARTIFACT_STORAGE_TYPE: "blob"
      RUNNER_TYPE: "local"
      POSTGRES_HOST: "postgis"
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: "haste"
      POSTGRES_USER: "haste"
      POSTGRES_PASSWORD: "haste-dev-only"  # pragma: allowlist secret # gitleaks:allow
      # The local postgis image has no TLS; hastegeo defaults to
      # sslmode=require for production safety, so dev opts out here.
      POSTGRES_SSLMODE: "disable"
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;"  # pragma: allowlist secret # gitleaks:allow
      AZURE_STORAGE_USE_EMULATOR: "true"
      AZURE_STORAGE_EMULATOR_HOST: "azurite:10000"
      AZURE_BATCH_DOCKER_IMAGE: "haste-training:latest"
      AZURE_BATCH_IMAGERYPREP_DOCKER_IMAGE: "haste-imageryprep:latest"
      HASTE_DEBUG_VERBOSE: "1"
      # Keep failed task dirs so output.log survives cleanup_task() for
      # diagnosis; the UI status message alone is rarely enough.
      PRESERVE_LOCAL_TASK_DIRS: "${PRESERVE_LOCAL_TASK_DIRS:-0}"
      # Statewide building-footprint GPKGs run to several GB, well past the
      # 500MB in-code default. Safe to raise now that the download streams
      # to disk and the clip step reads only the AOI bbox, so peak memory
      # no longer scales with file size. Forwarded to spawned containers by
      # LocalRunner (see the passthrough list in runners/local.py).
      HASTE_USER_FOOTPRINTS_MAX_BYTES: "${HASTE_USER_FOOTPRINTS_MAX_BYTES:-4294967296}"
      HASTE_OUTPUT_DIR: "/shared/azurite"
      # CPU-safe by default. This used to default to "1", which made LocalRunner
      # attach a GPU DeviceRequest to every spawned task container; on a host
      # without an NVIDIA GPU `containers.run(device_requests=...)` fails and the
      # pipeline dies. It only worked here because docker/.env sets 0 -- and
      # docker/.env is gitignored, so anyone cloning the repo hit the failure.
      #
      # This value is paired with the training image's TORCH_VARIANT build arg:
      # requesting a GPU is pointless against a CPU-only torch build, and a
      # cu124 build is wasted without the device. Do not set this to 1 here --
      # use the override file, which flips both together and cannot drift:
      #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
      HASTE_ENABLE_GPU: "${HASTE_ENABLE_GPU:-0}"
      HASTE_GPU_DEVICES: "${HASTE_GPU_DEVICES:-all}"
      HASTE_DATALOADER_WORKERS: "8"
      TITILER_ENDPOINT: "http://titiler:8000/"
      TITILER_PUBLIC_ENDPOINT: "http://${HOST_IP:-localhost}:7071/api/titiler/"
      # Docker volume/network names (prefixed by docker-compose project name)
      HASTE_DOCKER_NETWORK: "docker_default"
      HASTE_DOCKER_AZURITE_VOLUME: "docker_azurite-data"
      # Memory settings for training containers (increase for large VMs)
      HASTE_DOCKER_SHM_SIZE: "${HASTE_DOCKER_SHM_SIZE:-64g}"
      HASTE_DOCKER_MEM_LIMIT: "${HASTE_DOCKER_MEM_LIMIT:-256g}"
      # Pre-downloaded DamageTriageFormer checkpoint paths (skip HuggingFace download)
      DTF_CHECKPOINT_PATH: "/app/models/damage_triage/best_model.pth"
      DTF_CHECKPOINT_CONFIG_PATH: "/app/models/damage_triage/config.json"
    volumes:
      - ../data:/app/data
      - azurite-data:/shared/azurite  # Mount azurite blob storage for LocalRunner access
      - /var/run/docker.sock:/var/run/docker.sock  # Enable Docker access for LocalRunner
      - ../../../models/damage_triage:/app/models/damage_triage:ro  # Pre-downloaded DTF checkpoint
      # HF checkpoint cache for DTF inference (fallback).
      - ~/.cache/huggingface/hub:/home/.cache/huggingface/hub
    group_add:
      - "${DOCKER_GID:-1001}"
    depends_on:
      azurite:
        condition: service_started
      data-init:
        condition: service_completed_successfully
      training_image:
        condition: service_started
      imageryprep_image:
        condition: service_started
      titiler:
        condition: service_started
      postgis:
        condition: service_healthy

  # ==============================================================================
  # UI SERVICE
  # ==============================================================================

  ui:
    build: ../ui
    ports:
      - "4280:4280"
    environment:
      # Use VM's public IP for external access, or use /api/ for SWA proxy
      VITE_API_URL: "http://${HOST_IP:-localhost}:7071/api/"
      VITE_STORAGE_APIM_URL: "http://${HOST_IP:-localhost}:10000"
      VITE_PROJECT_STORAGE_APIM_URL: "http://${HOST_IP:-localhost}:10000"
      VITE_TITILER_URL: "http://${HOST_IP:-localhost}:7071/api/titiler/"
      VITE_AZURE_MAPS_CLIENT_ID: "${VITE_AZURE_MAPS_CLIENT_ID:-placeholder}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - hastefuncapi
      - hastefuncqueues
      - titiler

  # ==============================================================================
  # BUILD-ONLY SERVICES (used by LocalRunner via docker run)
  # ==============================================================================

  # Training workflow image
  training_image:
    build:
      context: ..
      dockerfile: ./docker/training/Dockerfile
      args:
        # The local stack exposes no GPU to these containers, so the CUDA wheels
        # are dead weight here: `cpu` drops nvidia/* (2.7 GB) and triton (555 MB).
        # Azure Batch / ACR builds go through build_and_push_images.sh, which does
        # not pass this arg and therefore keeps the Dockerfile's cu124 default.
        # Set HASTE_TORCH_VARIANT=cu124 if you run this stack on a GPU host.
        TORCH_VARIANT: ${HASTE_TORCH_VARIANT:-cpu}
    image: haste-training

  # Imagery preparation image
  imageryprep_image:
    build:
      context: ..
      dockerfile: ./docker/imageryprep/Dockerfile
    image: haste-imageryprep

  # ==============================================================================
  # STANDALONE TRAINING SERVICE (for direct training runs, optional)
  # ==============================================================================

  training:
    shm_size: '20gb'
    deploy:
      resources:
        limits:
          memory: 32g
    build:
      context: ./training
      dockerfile: Dockerfile
    command: ["ls -la /app/training && source activate bda && conda info --envs && python fine_tune.py --config configs/config.yml --overwrite | tee -a /app/training/fine_tune.log"]
    volumes:
      - ../data/training:/app/training
    profiles:
      - standalone  # Only start with: docker-compose --profile standalone up training

# ==============================================================================
# SHARED VOLUMES
# ==============================================================================

volumes:
  azurite-data:
    driver: local
  postgis-data:
    driver: local