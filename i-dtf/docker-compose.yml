# Standalone compose file for i-dtf. Independent of, and never referenced
# by, Haste-DTF/haste-fork/docker/docker-compose.yml -- runs on its own
# default network, no shared services, no shared volumes.
#
#   docker compose up --build      # build + run the API on :8000
#   docker compose run --rm i-dtf python -m i-dtf.predict --input i-dtf/samples --save-json --save-mask
#
# Build context is the repo root (not this directory) because the image
# needs both i-dtf/ and Haste-DTF/Damage-TriageFormer/src -- see Dockerfile.
services:
  i-dtf:
    build:
      context: ..
      dockerfile: i-dtf/Dockerfile
    image: i-dtf:latest
    ports:
      - "8080:8000"
    volumes:
      # Existing pre-downloaded weights, read-only -- never copied into the
      # image or duplicated anywhere under i-dtf/.
      - ../models:/app/models:ro
      # Drop images to classify here on the host; results land in ./out.
      - ./samples:/app/i-dtf/samples:ro
      - ./out:/app/i-dtf/out
    environment:
      - HOST=0.0.0.0
      - PORT=8000
